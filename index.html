
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PC-SPEC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main App -->
    <main id="app">

        <!-- Home -->
        <section id="homePage" class="page active">

            <div class="home-content">

                <div class="logo">
                    PC<span>•</span>SPEC
                </div>

                <p class="home-message">
                    دنیای قطعات کامپیوتر<br>
                    را کاوش کنید
                </p>

                <button id="exploreBtn" class="explore-btn">
                    کاوش
                    <span>←</span>
                </button>

            </div>

        </section>


        <!-- Search -->
        <section id="searchPage" class="page">

            <div class="page-header">
                <h1>جستجو</h1>
            </div>

            <div class="search-box">

                <span class="search-icon">⌕</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="جستجوی CPU یا GPU..."
                    autocomplete="off"
                >

                <button id="clearSearch" class="clear-search">
                    ×
                </button>

            </div>

            <div id="searchResults" class="results">

                <div class="empty-search">
                    <div class="empty-icon">⌕</div>
                    <p>نام یک قطعه را جستجو کنید</p>
                </div>

            </div>

        </section>


        <!-- Saved -->
        <section id="savedPage" class="page">

            <div class="page-header">
                <h1>ذخیره‌شده‌ها</h1>
            </div>

            <div id="savedResults" class="results">

                <div class="empty-saved">

                    <div class="empty-icon">♡</div>

                    <p>
                        هنوز قطعه‌ای ذخیره نکرده‌اید
                    </p>

                </div>

            </div>

        </section>


        <!-- Categories -->
        <section id="categoriesPage" class="page">

            <div class="page-header">
                <h1>دسته‌بندی</h1>
            </div>

            <div class="categories">

                <button class="category-card" data-category="GPU">
                    <span class="category-icon">▣</span>
                    <span>کارت گرافیک</span>
                </button>

                <button class="category-card" data-category="CPU">
                    <span class="category-icon">▦</span>
                    <span>پردازنده</span>
                </button>

            </div>

            <div id="categoryResults" class="results"></div>

        </section>

<!-- Compare -->
<section id="comparePage" class="page">

    <div class="page-header">
        <h1>مقایسه</h1>
    </div>

    <div class="compare-slots">

        <button class="compare-slot" id="compareSlot1">
            <span class="compare-plus">+</span>
            <span>انتخاب قطعه</span>
        </button>

        <div class="compare-vs">
            VS
        </div>

        <button class="compare-slot" id="compareSlot2">
            <span class="compare-plus">+</span>
            <span>انتخاب قطعه</span>
        </button>

    </div>

    <div id="compareSelection" class="compare-selection">

        <div class="compare-selection-header">
            <span>انتخاب قطعه</span>

            <button id="closeCompareSelection">
                ×
            </button>
        </div>

        <div class="compare-search">
            <input
                type="text"
                id="compareSearchInput"
                placeholder="جستجوی CPU یا GPU..."
                autocomplete="off"
            >
        </div>

        <div id="compareProductList"></div>

    </div>

    <div id="compareResult" class="compare-result"></div>

</section>
      
        <!-- Product Details -->
        <section id="productPage" class="page">

            <button id="backButton" class="back-button">
                ← بازگشت
            </button>

            <div id="productDetails"></div>

        </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

    <button class="nav-item active" data-page="homePage">
        <span class="nav-icon">⌂</span>
        <span>خانه</span>
    </button>

    <button class="nav-item" data-page="searchPage">
        <span class="nav-icon">⌕</span>
        <span>سرچ</span>
    </button>

    <button class="nav-item" data-page="comparePage">
        <span class="nav-icon">⚖</span>
        <span>مقایسه</span>
    </button>

    <button class="nav-item" data-page="savedPage">
        <span class="nav-icon">♡</span>
        <span>ذخیره</span>
    </button>

    <button class="nav-item" data-page="categoriesPage">
        <span class="nav-icon">▦</span>
        <span>دسته‌بندی</span>
    </button>

    </nav>


    <script src="data/gpu.js"></script>
<script src="data/cpu.js"></script>
<script src="script.js"></script>
  
</body>
</html>
